name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check src tests tools
      - run: uv run ruff check src tests tools
      - run: uv run mypy src tests tools
      - run: uv run pytest --cov=sunday --cov-report=term-missing

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv venv --python 3.12 .venv-minimum
      - run: uv pip install --python .venv-minimum/bin/python --resolution lowest-direct ".[all]" "pytest>=9.0"
      - run: .venv-minimum/bin/python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv build
      - run: uv run twine check dist/*
      - name: Verify wheel metadata
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          uv run python tools/verify_wheel.py "$wheel"
      - name: Smoke core-only wheel
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          core_venv="${RUNNER_TEMP}/sunday-core"
          uv venv --python 3.12 "$core_venv"
          uv pip install --python "$core_venv/bin/python" "$wheel"
          "$core_venv/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import sys

          import sunday

          assert "httpx" not in sys.modules
          assert "anyio" not in sys.modules
          for name in ("httpx", "anyio"):
              try:
                  metadata.version(name)
              except metadata.PackageNotFoundError:
                  pass
              else:
                  raise AssertionError(f"{name} was installed")
          PY
      - name: Verify core-only missing-extra diagnostic
        run: |
          core_venv="${RUNNER_TEMP}/sunday-core"
          "$core_venv/bin/python" - <<'PY'
          try:
              import sunday.httpx
          except ImportError as error:
              assert str(error) == "sunday.httpx requires the 'httpx' extra; install 'sunday-python[httpx]'"
          else:
              raise AssertionError("sunday.httpx imported without its extra")
          PY
      - name: Smoke HTTPX wheel extra
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          httpx_venv="${RUNNER_TEMP}/sunday-httpx"
          uv venv --python 3.12 "$httpx_venv"
          uv pip install --python "$httpx_venv/bin/python" "${wheel}[httpx]"
          "$httpx_venv/bin/python" -c "from sunday.httpx import HttpxEventStream, HttpxTransport; from sunday.httpx_compat import Operation; from sunday.httpx_sse import HttpxEventStream as LegacyEventStream; assert LegacyEventStream is HttpxEventStream"
      - name: Smoke remaining optional modules
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          uv run --isolated --with "${wheel}[litestar,cbor,xml,yaml]" \
            python -c "import sunday.litestar; import sunday.cbor; import sunday.xml; import sunday.yaml"
