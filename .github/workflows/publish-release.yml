name: Publish Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-*"
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check src tests tools
      - run: uv run ruff check src tests tools
      - run: uv run mypy src tests tools
      - run: uv run pytest --cov=sunday --cov-report=term-missing
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python -c "from packaging.version import Version; import os; expected = Version(os.environ['RELEASE_TAG']); assert expected.is_prerelease or not expected.is_devrelease"
      - run: uv build
      - run: uv run twine check dist/*
      - name: Verify wheel module boundary
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          uv run python tools/verify_wheel.py "$wheel"
      - name: Validate artifact version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python -c "from os import environ; from pathlib import Path; from packaging.utils import parse_wheel_filename; from packaging.version import Version; wheel = next(Path('dist').glob('*.whl')); assert parse_wheel_filename(wheel.name)[1] == Version(environ['RELEASE_TAG'])"
      - uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/') && vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: startsWith(github.ref, 'refs/tags/') && vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: 🚀 ${{ github.ref_name }}
